<!DOCTYPE html>
<html lang="zh-CN" data-pagefind-ignore data-no-hub-nav>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机 10 题</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1a1a2e">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"SF Pro Display","Noto Serif SC","Songti SC",sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0a0e1a 100%);background-attachment:fixed;color:#e4e6eb;line-height:1.7;min-height:100vh}
.container{max-width:760px;margin:0 auto;padding:40px 16px 80px}
header{text-align:center;padding:28px 0 12px}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#00d4ff 0%,#7b61ff 50%,#ff6ec4 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:1px}
.sub{color:#a0a8c0;font-size:.9rem;margin-top:6px}
.back{position:fixed;top:16px;left:16px;padding:7px 13px;border-radius:14px;background:rgba(30,30,50,.8);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);color:#a0a8c0;text-decoration:none;font-size:.8rem;z-index:100}
.back:hover{color:#fff}
.score{position:sticky;top:0;z-index:5;display:none;gap:12px;align-items:center;padding:12px 2px;margin:10px 0 14px;font-size:.85rem;color:#a0a8c0;background:rgba(19,27,48,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.08)}
.score.on{display:flex}
.score b{color:#fff;font-size:1.05rem}
.track{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:#7b61ff;transition:width .25s}
.q{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px;margin-bottom:14px}
.meta{font-size:.76rem;color:#7b8299;margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap}
.meta .again{color:#ff8a7a}
.stem{font-weight:600;font-size:1rem;margin-bottom:12px}
.opt{display:flex;gap:10px;width:100%;text-align:left;font:inherit;font-size:.95rem;color:inherit;line-height:1.55;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:#7b61ff}
.opt:disabled{cursor:default}
.opt .k{color:#7b8299;font-weight:700;flex:none}
.opt.right{border-color:#4cc38a;background:rgba(76,195,138,.13)}
.opt.wrong{border-color:#ff6b6b;background:rgba(255,107,107,.12)}
.explain{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.14);font-size:.9rem;color:#cdd2e4}
.q.done .explain{display:block}
.explain b.ok{color:#4cc38a}.explain b.bad{color:#ff8a7a}
.explain a{color:#a89bff}
.done-box{display:none;text-align:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:22px 16px}
.done-box.on{display:block}
.big{font-size:2.2rem;font-weight:800}
.stat{color:#a0a8c0;font-size:.85rem;margin:6px 0 14px}
.btn{padding:10px 22px;border-radius:12px;border:1px solid #7b61ff;background:#7b61ff;color:#fff;font:inherit;font-size:.95rem;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:#6a50ee}
.empty{text-align:center;color:#a0a8c0;padding:50px 16px;line-height:2}
.warn{color:#ffa726;font-size:.8rem;margin-top:8px}
</style>
</head>
<body>
<a class="back" href="/">← Hub</a>
<div class="container">
  <header>
    <h1>随机 10 题</h1>
    <div class="sub">从你读过的文章里抽，做完可以再来一轮</div>
  </header>
  <div class="score" id="score"><span>得分 <b id="sc">0</b> / <span id="tot">0</span></span><div class="track"><i id="bar"></i></div><span id="left"></span></div>
  <div class="sub" id="short" style="text-align:center;margin-bottom:14px"></div>
  <div id="list"><div class="empty">加载中…</div></div>
  <div class="done-box" id="done">
    <div class="big" id="big"></div>
    <div class="stat" id="stat"></div>
    <button class="btn" id="again">再来 10 题</button>
    <div class="warn" id="warn"></div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  var API = LOCAL ? 'http://localhost:8787' : 'https://bigcat-engage.cissychen.workers.dev';
  var ROUND = 10, MAX_RETRY = 3;   // at most this many earlier mistakes per round
  var KEYS = ['A', 'B', 'C', 'D'];
  var $ = function (id) { return document.getElementById(id); };
  var manifest, readSet = {}, history = {}, round = [], lastRound = {}, failed = 0;

  function session() { try { return localStorage.getItem('bigcat-session') || ''; } catch (e) { return ''; } }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function post(path, body) {
    body.session = session();
    return fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) {
        if (r.status === 401) { var e = new Error('unauthorized'); e.auth = true; throw e; }
        return r.json();
      });
  }
  function shuffled(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function message(html) { $('list').innerHTML = '<div class="empty">' + html + '</div>'; }
  function askLogin() {
    message('登录后才能做题，这样才知道你读过什么、做过什么。<br><br><a class="btn" href="/account.html?next=/quiz.html">登录 / 注册</a>');
  }
  function bankKey(page) {
    var p = page.replace(/\.en\.html/, '.html');
    return (manifest.aliases && manifest.aliases[p]) || p;
  }

  // Only articles this reader has read: a few earlier mistakes, then never-seen
  // questions, then the ones answered right longest ago. One question per article
  // first; a second from the same article only if that leaves the round short.
  function pick() {
    var pool = [];
    Object.keys(manifest.pages).forEach(function (page) {
      if (!readSet[page]) return;
      manifest.pages[page].q.forEach(function (id) {
        pool.push({ id: id, page: page, h: history[id] });
      });
    });
    var fresh = pool.filter(function (x) { return !lastRound[x.id]; });
    if (fresh.length >= ROUND) pool = fresh;
    var wrong = shuffled(pool.filter(function (x) { return x.h && !x.h.last_correct; }));
    var unseen = shuffled(pool.filter(function (x) { return !x.h; }));
    var right = pool.filter(function (x) { return x.h && x.h.last_correct; })
      .sort(function (a, b) { return a.h.ts - b.h.ts; });
    var order = wrong.slice(0, MAX_RETRY).concat(unseen, right, wrong.slice(MAX_RETRY));
    var out = [], pages = {};
    order.forEach(function (x) {
      if (out.length < ROUND && !pages[x.page]) { pages[x.page] = 1; out.push(x); }
    });
    order.forEach(function (x) {
      if (out.length < ROUND && out.indexOf(x) < 0) out.push(x);
    });
    return out;
  }

  function loadRound() {
    var picks = pick();
    if (!picks.length) {
      message(Object.keys(readSet).length
        ? '你读过的文章还没有题，题库每天都在补，过几天再来。'
        : '题目只从你读过的文章里出。先去读几篇，读到文章末尾就会自动记为已读。<br><br><a class="btn" href="/">去读文章</a>');
      return;
    }
    $('short').textContent = picks.length < ROUND
      ? '你读过的文章目前只有 ' + picks.length + ' 题，题库每天都在补。' : '';
    $('done').classList.remove('on');
    message('抽题中…');
    var files = {};
    picks.forEach(function (x) { files[x.page] = 1; });
    Promise.all(Object.keys(files).map(function (page) {
      return fetch('/quiz/' + manifest.pages[page].f).then(function (r) {
        if (!r.ok) throw new Error('bank ' + r.status);
        return r.json();
      }).then(function (d) { files[page] = d; });
    })).then(function () {
      round = [];
      picks.forEach(function (x) {
        var d = files[x.page];
        var q = d.questions.filter(function (y) { return y.id === x.id; })[0];
        if (!q) return;
        var order = shuffled([0, 1, 2, 3]);   // a new order each time, so nobody memorises "it was C"
        round.push({ id: q.id, page: x.page, title: d.title, again: !!(x.h && !x.h.last_correct),
          question: q.question, explanation: q.explanation,
          options: order.map(function (j) { return q.options[j]; }), answer: order.indexOf(q.answer), picked: null });
      });
      lastRound = {};
      round.forEach(function (q) { lastRound[q.id] = 1; });
      render();
    }).catch(function () { message('题目加载失败，刷新页面再试一次。'); });
  }

  function render() {
    failed = 0;
    $('warn').textContent = '';
    $('score').classList.add('on');
    $('list').innerHTML = round.map(function (q, i) {
      var tags = '<span>' + (i + 1) + ' / ' + round.length + '</span><span>' + esc(q.title) + '</span>' +
        (q.again ? '<span class="again">↺ 上次答错</span>' : '');
      var opts = q.options.map(function (o, j) {
        return '<button class="opt" data-i="' + i + '" data-j="' + j + '"><span class="k">' + KEYS[j] + '</span><span>' + esc(o) + '</span></button>';
      }).join('');
      return '<section class="q" id="q' + i + '"><div class="meta">' + tags + '</div><p class="stem">' + esc(q.question) + '</p>' + opts +
        '<div class="explain"><b></b> ' + esc(q.explanation) + ' <a href="' + esc(q.page) + '" target="_blank" rel="noopener">回原文 →</a></div></section>';
    }).join('');
    tally();
    window.scrollTo(0, 0);
  }

  function choose(i, j) {
    var q = round[i];
    if (q.picked !== null) return;
    q.picked = j;
    var ok = j === q.answer, el = $('q' + i);
    el.querySelectorAll('.opt').forEach(function (b, k) {
      b.disabled = true;
      if (k === q.answer) b.classList.add('right'); else if (k === j) b.classList.add('wrong');
    });
    var v = el.querySelector('.explain b');
    v.textContent = ok ? '✓ 对了。' : '✗ 答案是 ' + KEYS[q.answer] + '。';
    v.className = ok ? 'ok' : 'bad';
    el.classList.add('done');
    var prev = history[q.id] || { right_n: 0, wrong_n: 0 };
    history[q.id] = { right_n: prev.right_n + (ok ? 1 : 0), wrong_n: prev.wrong_n + (ok ? 0 : 1), last_correct: ok ? 1 : 0, ts: Date.now() };
    post('/quiz-answer', { qid: q.id, page: q.page, correct: ok }).then(function (r) {
      if (!r.ok) throw new Error(r.error);
    }).catch(function () {
      failed++;
      $('warn').textContent = '⚠️ ' + failed + ' 道题的记录没存上，下次可能再抽到。';
    });
    tally();
  }

  function tally() {
    var n = round.length, done = 0, right = 0;
    round.forEach(function (q) { if (q.picked !== null) { done++; if (q.picked === q.answer) right++; } });
    $('sc').textContent = right; $('tot').textContent = n;
    $('bar').style.width = (n ? done / n * 100 : 0) + '%';
    $('left').textContent = done < n ? '还剩 ' + (n - done) + ' 题' : '完成';
    if (n && done === n) {
      $('big').textContent = right + ' / ' + n;
      var R = 0, W = 0;
      Object.keys(history).forEach(function (k) { R += history[k].right_n; W += history[k].wrong_n; });
      $('stat').textContent = '累计答过 ' + (R + W) + ' 次，正确率 ' + Math.round(R / (R + W) * 100) + '%';
      $('done').classList.add('on');
    }
  }

  $('list').addEventListener('click', function (e) {
    var b = e.target.closest('.opt');
    if (b) choose(+b.dataset.i, +b.dataset.j);
  });
  $('again').addEventListener('click', loadRound);

  if (!session()) { askLogin(); return; }
  Promise.all([
    fetch('/quiz/manifest.json', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('manifest'); return r.json(); }),
    post('/reads-list', {}),
    post('/quiz-history', {})
  ]).then(function (res) {
    manifest = res[0];
    (res[1].reads || []).forEach(function (r) { if (r.is_read) readSet[bankKey(r.page)] = 1; });
    (res[2].answers || []).forEach(function (a) { history[a.qid] = a; });
    loadRound();
  }).catch(function (e) {
    if (e.auth) askLogin(); else message('加载失败，刷新页面再试一次。');
  });
})();
</script>
</body>
</html>
