name: Build Search Index

# Aggregate HTML from all routine repos, run Pagefind, publish index.
# Output lives at /pagefind/ on cissy0802.github.io.

on:
  schedule:
    # 13:00 UTC = 6 AM PDT (after all routines + per-repo comments injection)
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone all routine repos into _src
        run: |
          rm -rf _src
          mkdir -p _src
          for repo in \
            mental-models meta-knowledge \
            super-individual ai-ml system-design cs-papers-deepread chapter-deepread \
            leadership writing sales \
            health-longevity parenting psychology family-craft \
            philosophy buddhism art-aesthetics biographies \
            book-recommendations deep-reading \
            mathematics history investing civics-geopolitics \
            neuroscience physics world-religions personal-finance \
            deep-research; do
            echo "Cloning $repo..."
            git clone --depth 1 --quiet "https://github.com/cissy0802/$repo" "_src/$repo"
            rm -rf "_src/$repo/.git" "_src/$repo/.github"
          done
          # Hub landing pages stay out — they're just nav, not content.
          # But the hub's own hand-written long-forms (blog-pipeline, the
          # synthesis-* essays) ARE content and were previously unsearchable.
          # They're served from the domain root, so they must sit at _src root
          # for Pagefind to emit correct result URLs (_src/foo.html -> /foo.html;
          # a subdirectory here would produce URLs that 404).
          cp blog-pipeline.html blog-pipeline.en.html _src/
          cp synthesis-*.html _src/

      - name: Add Thinking Hub (thinker-arena) debates
        run: |
          git clone --depth 1 --quiet "https://github.com/cissy0802/thinker-arena" "_src/thinker-arena"
          rm -rf "_src/thinker-arena/.git" "_src/thinker-arena/.github"
          # Debates render client-side from JSON, so Pagefind sees empty shells.
          # Pre-render static, crawlable snapshots (one per debate per language)
          # whose result URLs point back at the live interactive debate page.
          python3 render_search_snapshots.py _src/thinker-arena
          # Keep only the generated snapshots under search/; drop the client-rendered
          # scaffolding (index.html, debate.html, *.js, *.json) so the empty shells
          # don't surface as junk search results.
          find _src/thinker-arena -maxdepth 1 -type f -delete
          rm -rf _src/thinker-arena/debates

      - name: Segment CJK text so Chinese compounds are searchable
        run: |
          # Pagefind's built-in CJK segmentation stores Chinese compounds as whole
          # word-tokens (e.g. "拓扑直觉"), so a query like "拓扑" gets split into
          # single chars and fails to match. Fix: insert a zero-width space (U+200B)
          # between adjacent CJK ideographs in VISIBLE TEXT ONLY (between > and <),
          # forcing per-character tokens. U+200B is invisible, so result excerpts
          # stay clean; queries need no change. Runs on the throwaway _src copies
          # only — live pages and the shipped result URLs are untouched.
          python3 - <<'PY'
          import glob, re
          ZWSP = "\u200b"
          def seg(t):
              return re.sub(r'[一-鿿]{2,}', lambda m: ZWSP.join(m.group(0)), t)
          n = 0
          for f in glob.glob('_src/**/*.html', recursive=True):
              try:
                  s = open(f, encoding='utf-8').read()
              except Exception:
                  continue
              new = re.sub(r'>([^<]+)<', lambda m: '>' + seg(m.group(1)) + '<', s)
              if new != s:
                  open(f, 'w', encoding='utf-8').write(new)
                  n += 1
          print(f"Segmented CJK in {n} files")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Pagefind
        run: |
          # Pagefind doesn't clean its output dir; wipe it so fragments from
          # previous builds (stale URLs) don't accumulate in the repo.
          rm -rf pagefind
          npx -y pagefind@latest \
            --site _src \
            --output-path pagefind \
            --exclude-selectors "footer,nav,.section-label,#bigcat-comments,a[href*='cissy0802.github.io/']"

      - name: Cleanup _src (only ship index)
        run: rm -rf _src

      - name: Commit and push index if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pagefind
          if git diff --cached --quiet; then
            echo "No search-index changes."
            exit 0
          fi
          git commit -m "Refresh Pagefind search index"
          git push
