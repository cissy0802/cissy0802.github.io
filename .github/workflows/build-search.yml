name: Build Search Index

# Aggregate HTML from all routine repos, run Pagefind, publish the index.
# Output goes to the bigcat-search R2 bucket, served by search-backend/'s Worker
# at https://bigcat-search.cissychen.workers.dev/pagefind/ — nothing lands in git.

on:
  schedule:
    # 13:00 UTC = 6 AM PDT (after all routines + per-repo comments injection)
    - cron: '0 13 * * *'
  workflow_dispatch:

# Nothing is committed any more — the index goes to R2.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone all routine repos into _src
        run: |
          rm -rf _src
          mkdir -p _src
          for repo in \
            mental-models meta-knowledge \
            super-individual ai-ml system-design cs-papers-deepread chapter-deepread \
            leadership writing sales \
            health-longevity parenting psychology family-craft \
            philosophy buddhism art-aesthetics biographies \
            book-recommendations deep-reading \
            mathematics history investing civics-geopolitics \
            neuroscience physics world-religions personal-finance \
            deep-research synthesis; do
            echo "Cloning $repo..."
            git clone --depth 1 --quiet "https://github.com/cissy0802/$repo" "_src/$repo"
            rm -rf "_src/$repo/.git" "_src/$repo/.github"
          done
          # Hub landing pages stay out — they're just nav, not content.
          # But blog-pipeline IS content and was previously unsearchable: it's a
          # one-off essay that lives in the hub repo rather than a content repo.
          # It's served from the domain root, so it must sit at _src root for
          # Pagefind to emit a correct result URL (_src/foo.html -> /foo.html;
          # a subdirectory here would produce a URL that 404s).
          # (The synthesis essays used to need this too; they now live in their
          # own repo and come in via the clone loop above. The synthesis-*.html
          # left at the hub root are redirect stubs, marked data-pagefind-ignore.)
          cp blog-pipeline.html blog-pipeline.en.html _src/

      - name: Add Thinking Hub (thinker-arena) debates
        run: |
          git clone --depth 1 --quiet "https://github.com/cissy0802/thinker-arena" "_src/thinker-arena"
          rm -rf "_src/thinker-arena/.git" "_src/thinker-arena/.github"
          # Debates render client-side from JSON, so Pagefind sees empty shells.
          # Pre-render static, crawlable snapshots (one per debate per language)
          # whose result URLs point back at the live interactive debate page.
          python3 render_search_snapshots.py _src/thinker-arena
          # Keep only the generated snapshots under search/; drop the client-rendered
          # scaffolding (index.html, debate.html, *.js, *.json) so the empty shells
          # don't surface as junk search results.
          find _src/thinker-arena -maxdepth 1 -type f -delete
          rm -rf _src/thinker-arena/debates

      # CJK sub-word recall: an ordered bigram shadow block per page.
      #
      # Pagefind's segmenter stores Chinese compounds whole, so "拓扑" finds
      # nothing — it only ever occurs inside 拓扑学 / 拓扑指纹 / 拓扑不变 (61 pages
      # containing the string, 1 result). Overlapping bigrams give every 2-char
      # window its own token, which is the standard dictionary-free CJK indexing
      # scheme (Lucene's CJKAnalyzer, Elasticsearch's `cjk` analyzer).
      #
      # Two properties this MUST keep, both learned the hard way:
      #   ORDER PRESERVED, NOT DEDUPED — adjacent bigrams have to stay adjacent
      #     or exact-phrase queries over them match nothing ("贝叶 叶斯" → 0).
      #   VISIBLE TEXT UNTOUCHED — the shadow goes in a hidden block, so result
      #     excerpts still come from real prose. (Pagefind parses HTML without
      #     CSS, so display:none is indexed.)
      #
      # Do NOT "simplify" this into per-character tokens. That was the 2026-07-18
      # version, and because Pagefind DROPS query terms it can't find rather than
      # returning zero, "现象学" collapsed to the single char "学" and matched 1172
      # pages. search.js queries this index phrase-first, bigrams second.
      - name: Add CJK bigram shadow text
        run: |
          python3 - <<'PY'
          import glob, re
          RUN = re.compile(r'[\u4e00-\u9fff]{2,}')
          VISIBLE = re.compile(r'>([^<]+)<')

          def enc(a, b):
              # Bigrams are emitted as opaque ASCII, NOT as the CJK pair itself.
              # Written as Chinese, Pagefind's segmenter re-segments the shadow
              # text and dissolves the pairs back into (mostly single-char)
              # tokens: "贝叶斯" then matched 75 pages against 24 that contain it,
              # and '"叶斯"' matched 50 — incoherent for a supposedly atomic
              # token. Hex codepoints are one Latin word to the tokenizer, so a
              # bigram stays exactly one term. search.js encodes queries the same.
              return 'bg%04x%04x' % (ord(a), ord(b))

          n = 0
          for f in glob.glob('_src/**/*.html', recursive=True):
              try:
                  s = open(f, encoding='utf-8').read()
              except Exception:
                  continue
              grams = []
              for m in VISIBLE.finditer(s):
                  for run in RUN.findall(m.group(1)):
                      grams.append(' '.join(enc(run[i], run[i + 1])
                                            for i in range(len(run) - 1)))
              if not grams:
                  continue
              # Marker so the client can tell whether the index it's talking to
              # carries shadow text in the scheme it speaks — the bigram tier is
              # wrong against an index without it. Bump the version whenever the
              # encoding changes, so a cached client and a new index can't
              # half-agree.
              shadow = ('<div style="display:none">pfbigramv2 '
                        + '  '.join(grams) + '</div>')
              s2 = s.replace('</body>', shadow + '</body>', 1) if '</body>' in s else s + shadow
              open(f, 'w', encoding='utf-8').write(s2)
              n += 1
          print(f"Added bigram shadow to {n} files")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Pagefind
        run: |
          # Pagefind doesn't clean its output dir; wipe it so a stale fragment
          # from a previous run can't be re-uploaded as if it were current.
          rm -rf pagefind
          npx -y pagefind@latest \
            --site _src \
            --output-path pagefind \
            --exclude-selectors "footer,nav,.section-label,#bigcat-comments,a[href*='cissy0802.github.io/']"

      - name: Cleanup _src (only ship index)
        run: rm -rf _src

      # The index lives in R2, not in this repo: ~3100 files / 46MB rebuilt
      # nightly had pushed .git past 700MB when it was committed. search-backend/
      # holds the Worker that serves it; sync-index.py is shared with local runs
      # so the two paths can't drift.
      - name: Upload index to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          # --upgrade matters: the runner ships a system boto3 old enough that
          # pip would call the requirement satisfied and leave it in place.
          pip install --quiet --upgrade boto3
          python3 search-backend/sync-index.py pagefind
