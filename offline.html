<style>

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"SF Pro Display","Noto Serif SC","Songti SC",sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0a0e1a 100%);color:#e4e6eb;line-height:1.7;min-height:100vh}
.container{max-width:980px;margin:0 auto;padding:48px 24px 80px}
header{text-align:center;padding:48px 0 48px}

.lang-toggle{position:fixed;top:18px;right:18px;background:rgba(255,255,255,0.06);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:5px;display:flex;gap:0;z-index:100;font-family:"SF Mono",Menlo,monospace;font-size:0.78rem}

.card::before{content:"";position:absolute;top:0;left:0;bottom:0;width:4px;background:var(--accent);opacity:0.85}
.card:hover{transform:translateX(3px);background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.15);box-shadow:0 4px 16px rgba(0,0,0,0.3)}

.card.family{--accent:#ffd166}
.card.family::before{background:linear-gradient(90deg,#ffd166,#e8743b)}
.card.thinker{--accent:#a29bfe}
.card.thinker::before{background:linear-gradient(90deg,#a29bfe,#7b61ff,#ff6ec4)}
.card.research{--accent:#4cc9f0}

.group-label{font-size:1.02rem;font-weight:700;color:#b9a8ff;letter-spacing:2.5px;text-transform:uppercase;margin-top:42px;margin-bottom:6px;font-family:"SF Mono",Menlo,monospace}

.section-label:first-of-type{margin-top:6px}
.search-prompt{margin:24px auto 0;max-width:520px;text-align:center;padding:14px 18px;background:rgba(255,255,255,0.04);border:1px solid rgba(123,97,255,0.25);border-radius:10px;font-size:0.88rem;color:#a0a8c0;font-family:"SF Mono",Menlo,monospace}

/* Offline-library additions, on top of the landing's own styles. */
.state{display:inline-block;margin-top:12px;padding:4px 12px;border-radius:12px;font:600 .74rem "SF Mono",Menlo,monospace}
.state.on{background:rgba(58,161,126,.14);color:#7ee2a8;border:1px solid rgba(58,161,126,.4)}

.clear-site{background:none;border:1px solid rgba(255,255,255,.16);color:#6a7080;font:400 .68rem "SF Mono",Menlo,monospace;letter-spacing:0;text-transform:none;padding:3px 10px;border-radius:12px;cursor:pointer}

<body>
<a class="notes-link" id="navNotes" href="/notes.html">📝 我的笔记</a>
<div class="lang-toggle">
  <a href="/index.zh.html">中文</a>
  <a href="/index.en.html">EN</a>
</div>
<div class="container">
<header>
  <h1 id="h1">离线可读</h1>
  <div class="tagline" id="sub">这台设备上已下载、断网也能打开的内容</div>
  <div id="state"></div>
  <div class="subtitle" id="usage"></div>
</header>
<div class="list" id="list"><div class="empty" id="loading">正在读取已下载内容…</div></div>
</div>

<script>
(function () {
  'use strict';
  var CACHE = 'offline-content-v1';
  var zh = (navigator.language || 'zh').toLowerCase().indexOf('zh') === 0;
  var T = zh
    ? { h1: '离线可读', sub: '这台设备上已下载、断网也能打开的内容',
        loading: '正在读取已下载内容…',
        empty: '还没有下载任何内容。<br>联网时在文章列表点每篇右侧的 ⤓，或在 Hub 首页点卡片上的 ⤓ 整仓下载。',
        online: '● 在线', offline: '● 离线', audio: '含语音', other: '其他',
        enter: '打开 →', notes: '📝 我的笔记',
        del: '删除', delOne: '从离线存储中删除这一篇？', delRepo: '删除这个站已下载的全部内容？',
        clearSite: '清空本站', used: '已占用' }
    : { h1: 'Offline Library', sub: 'Everything downloaded to this device — readable with no connection',
        loading: 'Reading downloaded content…',
        empty: 'Nothing downloaded yet.<br>While online, tap ⤓ next to an article in a site index, or ⤓ on a card on the hub landing to take a whole site.',
        online: '● Online', offline: '● Offline', audio: 'with audio', other: 'Other',
        enter: 'open →', notes: '📝 My Notes',
        del: 'Delete', delOne: 'Remove this piece from offline storage?', delRepo: 'Remove everything downloaded from this site?',
        clearSite: 'Clear site', used: 'used' };

  // [emoji, zh name, en name, accent class] — accent classes are the landing's
  // own, so a site keeps the same colour here as on the hub.
  var REPOS = {"thinker-arena": ["⚖️","思想家圆桌辩论","Thinker Roundtable","thinker"],"deep-research": ["🔬","深度研究","Deep Research","research"],"synthesis": ["🔗","跨站合成","Cross-Site Synthesis","synthesis"],"mental-models": ["📚","思维模型","Mental Models","mental"],"meta-knowledge": ["🧠","元知识","Meta Knowledge","meta"],"super-individual": ["⚡","AI 超级个体实战","Super Individual","super"],"ai-ml": ["🤖","AI / ML","AI & ML","aiml"],"system-design": ["🏗️","System Design","System Design","sysd"],"cs-papers-deepread": ["📄","IT 论文精读","CS Papers","papers"],"chapter-deepread": ["📚","专业书籍精读","CS Books","csbooks"],"novel-deepread": ["📕","小说精读","Novels","novel"],"leadership": ["🎯","领导力实践","Leadership","leadership"],"sales": ["🤝","销售实战","Sales","sales"],"writing": ["✍️","写作与表达","Writing","writing"],"health-longevity": ["🫀","健康长寿","Health & Longevity","health"],"parenting": ["👶","育儿与教育","Parenting","parenting"],"psychology": ["🧩","心理学","Psychology","psych"],"family-craft": ["🧺","一起做","Doing Together","family"],"personal-finance": ["💵","个人理财","Personal Finance","finance"],"philosophy": ["📜","哲学经典","Philosophy","philosophy"],"buddhism": ["🪷","佛经","Buddhism","buddhism"],"world-religions": ["🕉️","世界宗教","World Religions","religions"],"art-aesthetics": ["🎨","艺术与审美","Art & Aesthetics","art"],"biographies": ["👩‍💼","人物传记","Biographies","bio"],"book-recommendations": ["📖","好书推荐","Book Recommendations","book"],"deep-reading": ["📰","好书精读","Deep Reading","deepread"],"mathematics": ["📐","数学之美","Mathematics","math"],"history": ["🏛️","历史大事件","History","history"],"investing": ["📈","投资经典","Investing","investing"],"civics-geopolitics": ["🌍","政治·法律·地缘","Civics & Geopolitics","civics"],"neuroscience": ["🧠","神经科学","Neuroscience","neuro"],"physics": ["⚛️","物理","Physics","physics"],"complexity-science": ["🌀","复杂性科学","Complexity Science","complexity"]};

  function repoInfo(slug) {
    var r = REPOS[slug];
    if (r) return { label: r[0] + ' ' + (zh ? r[1] : r[2]), emoji: r[0], name: zh ? r[1] : r[2], cls: r[3] };
    var name = slug ? slug.replace(/(^|-)([a-z])/g, function (_, d, c) { return (d ? ' ' : '') + c.toUpperCase(); }) : T.other;
    return { label: name, emoji: '📄', name: name, cls: '' };
  }

  document.getElementById('h1').textContent = T.h1;
  document.getElementById('sub').textContent = T.sub;
  document.getElementById('loading').textContent = T.loading;
  var nav = document.getElementById('navNotes');
  nav.textContent = T.notes;
  nav.href = zh ? '/notes.html' : '/notes.en.html';

  function paintState() {
    var el = document.getElementById('state');
    el.className = 'state ' + (navigator.onLine ? 'on' : 'off');
    el.textContent = navigator.onLine ? T.online : T.offline;
  }
  paintState();
  showUsage();
  window.addEventListener('online', paintState);
  window.addEventListener('offline', paintState);


  // Deleting has to clear the audio too, or the space stays used. The cached
  // HTML tells us which segments belong to a piece, and it's readable offline —
  // segment hashes are matched by filename so both the same-origin layout and
  // the R2 worker URLs are covered.
  function deletePage(c, item) {
    return c.match(item.req).then(function (res) {
      return res ? res.text() : '';
    }).then(function (html) {
      var hashes = [];
      var re = /data-tts="([a-f0-9]+)"/gi, m;
      while ((m = re.exec(html))) hashes.push(m[1]);
      // A debate's text and audio manifest sit beside the shell as JSON —
      // deleting only the HTML would leave them (and their space) behind.
      // thinkers.json is shared by every debate, so it goes with the site, not
      // with one piece.
      var extras = [];
      var deb = /\/thinker-arena\/debate(?:\.en)?\.html\?d=([\w-]+)/.exec(item.path);
      if (deb) {
        extras.push('/thinker-arena/debates/' + deb[1] + '.json');
        extras.push('/thinker-arena/audio/debate/' + deb[1] + '/manifest.json');
      }
      return c.keys().then(function (reqs) {
        var doomed = [item.req];
        reqs.forEach(function (r) {
          var u = new URL(r.url);
          if (/\.mp3$/i.test(u.pathname) &&
              hashes.some(function (h) { return u.pathname.indexOf('/' + h + '.mp3') >= 0; })) {
            doomed.push(r);
          }
        });
        return Promise.all(
          doomed.map(function (r) { return c.delete(r); })
            .concat(extras.map(function (u) { return c.delete(u); }))
        );
      });
    });
  }

  // Everything under one site, including its whole-repo marker and its audio
  // (which for migrated repos lives on another origin).
  function deleteRepo(c, slug) {
    return c.keys().then(function (reqs) {
      var doomed = reqs.filter(function (r) {
        var u = new URL(r.url);
        return u.pathname.indexOf('/' + slug + '/') === 0 ||
               u.pathname.indexOf('/__bigcat-downloaded/' + slug) === 0;
      });
      return Promise.all(doomed.map(function (r) { return c.delete(r); }));
    });
  }

  function showUsage() {
    if (!navigator.storage || !navigator.storage.estimate) return;
    navigator.storage.estimate().then(function (e) {
      if (!e || !e.usage) return;
      var mb = e.usage / 1048576;
      var el = document.getElementById('usage');
      if (el) el.textContent = T.used + ' ' + (mb >= 1024 ? (mb/1024).toFixed(1) + ' GB' : mb.toFixed(0) + ' MB');
    }).catch(function () {});
  }

  function tidyEmptyGroups() {
    var labels = [].slice.call(document.querySelectorAll('.group-label'));
    labels.forEach(function (l) {
      var n = l.nextElementSibling;
      if (!n || n.classList.contains('group-label')) l.remove();
    });
    if (!document.querySelector('.card')) {
      document.getElementById('list').innerHTML = '<div class="empty">' + T.empty + '</div>';
    }
  }

  var listEl = document.getElementById('list');
  if (!window.caches) { listEl.innerHTML = '<div class="empty">' + T.empty + '</div>'; return; }

  caches.open(CACHE).then(function (c) {
    return c.keys().then(function (reqs) {
      var pages = [], audio = {};
      reqs.forEach(function (r) {
        var u, p;
        try { u = new URL(r.url); p = u.pathname; } catch (e) { return; }
        if (/\.mp3$/i.test(p)) {
          var m = /^\/([^\/]+)\//.exec(p);
          if (m) audio[m[1]] = (audio[m[1]] || 0) + 1;
          return;
        }
        if (!/\.html$/i.test(p)) return;
        if (/^\/(index|notes|account|offline|confirm|unsubscribe|404|blog-)/.test(p)) return;
        pages.push({ path: p + (u.search || ''), req: r });
      });
      if (!pages.length) { listEl.innerHTML = '<div class="empty">' + T.empty + '</div>'; return; }

      return Promise.all(pages.map(function (item) {
        return c.match(item.req).then(function (res) {
          if (!res) return item;
          return res.text().then(function (html) {
            var t = /<title[^>]*>([\s\S]*?)<\/title>/i.exec(html);
            item.title = t ? t[1].replace(/\s+/g, ' ').trim() : item.path;
            var h1 = /<h1[^>]*>([\s\S]*?)<\/h1>/i.exec(html);
            if (h1) {
              var plain = h1[1].replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
              if (plain) item.title = plain;
            }
            item.hasAudio = /data-tts=/.test(html);
            // A debate's shell has a generic <title>; its real subject sits in
            // the JSON cached alongside it.
            var deb = /\/thinker-arena\/debate(?:\.en)?\.html\?d=([\w-]+)/.exec(item.path);
            if (!deb) return item;
            return c.match('/thinker-arena/debates/' + deb[1] + '.json')
              .then(function (jr) { return jr ? jr.json() : null; })
              .then(function (j) {
                if (j) item.title = (zh ? (j.question || j.question_zh) : (j.question_en || j.question)) || item.title;
                return item;
              }).catch(function () { return item; });
          }).catch(function () { return item; });
        });
      })).then(function (items) {
        var byRepo = {};
        items.forEach(function (it) {
          var m = /^\/([^\/]+)\//.exec(it.path);
          (byRepo[m ? m[1] : ''] = byRepo[m ? m[1] : ''] || []).push(it);
        });
        listEl.innerHTML = '';
        Object.keys(byRepo).sort().forEach(function (slug) {
          var info = repoInfo(slug);
          var rows = byRepo[slug].sort(function (a, b) { return a.path.localeCompare(b.path); });

          var label = document.createElement('div');
          label.className = 'group-label';
          label.dataset.slug = slug;
          var lname = document.createElement('span');
          lname.textContent = info.name + (audio[slug] ? ' · ' + audio[slug] + ' ' + T.audio : '');
          label.appendChild(lname);
          var clear = document.createElement('button');
          clear.className = 'clear-site';
          clear.type = 'button';
          clear.textContent = T.clearSite;
          clear.addEventListener('click', function () {
            if (!window.confirm(T.delRepo)) return;
            caches.open(CACHE).then(function (cc) {
              return deleteRepo(cc, slug);
            }).then(function () {
              listEl.querySelectorAll('[data-repo="' + slug + '"]').forEach(function (n) { n.remove(); });
              label.remove();
              showUsage();
              tidyEmptyGroups();
            });
          });
          label.appendChild(clear);
          listEl.appendChild(label);

          rows.forEach(function (it) {
            var a = document.createElement('a');
            a.className = 'card' + (info.cls ? ' ' + info.cls : '');
            a.href = it.path;
            a.setAttribute('data-repo', slug);

            var em = document.createElement('span');
            em.className = 'emoji';
            em.textContent = info.emoji;
            a.appendChild(em);

            var body = document.createElement('div');
            body.className = 'body';
            var row = document.createElement('div');
            row.className = 'title-row';
            var t = document.createElement('span');
            t.className = 'title';
            t.textContent = it.title || it.path;
            row.appendChild(t);
            if (it.hasAudio) {
              var au = document.createElement('span');
              au.className = 'subtitle-en';
              au.textContent = '♪ ' + T.audio;
              row.appendChild(au);
            }
            body.appendChild(row);
            var pth = document.createElement('div');
            pth.className = 'path';
            pth.textContent = it.path;
            body.appendChild(pth);
            a.appendChild(body);

            var meta = document.createElement('div');
            meta.className = 'meta';
            var arrow = document.createElement('span');
            arrow.className = 'arrow';
            arrow.textContent = T.enter;
            meta.appendChild(arrow);
            var del = document.createElement('button');
            del.className = 'del';
            del.type = 'button';
            del.textContent = '✕';
            del.title = T.del;
            del.addEventListener('click', function (ev) {
              ev.preventDefault();
              ev.stopPropagation();
              if (!window.confirm(T.delOne)) return;
              caches.open(CACHE).then(function (cc) {
                return deletePage(cc, it);
              }).then(function () { a.remove(); showUsage(); tidyEmptyGroups(); });
            });
            meta.appendChild(del);
            a.appendChild(meta);

            listEl.appendChild(a);
          });
        });
        showUsage();
      });
    });
  }).catch(function () {
    listEl.innerHTML = '<div class="empty">' + T.empty + '</div>';
  });
})();
</script>
</body>
</html>
