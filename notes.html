<!DOCTYPE html>
<html lang="zh-CN" data-pagefind-ignore data-no-hub-nav>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的笔记 · My Notes</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1a1a2e">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"SF Pro Display","Noto Serif SC","Songti SC",sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0a0e1a 100%);color:#e4e6eb;line-height:1.7;min-height:100vh}
.container{max-width:820px;margin:0 auto;padding:40px 20px 80px}
header{text-align:center;padding:28px 0 18px}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#00d4ff 0%,#7b61ff 50%,#ff6ec4 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:1px}
.sub{color:#a0a8c0;font-size:.9rem;margin-top:6px}
.bar{display:flex;gap:8px;align-items:center;margin:20px 0 14px;flex-wrap:wrap}
input[type=search]{flex:1;min-width:180px;padding:9px 13px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#e4e6eb;font-size:.9rem;font-family:inherit}
input[type=search]::placeholder{color:#6b7390}
.btn{padding:8px 13px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#a0a8c0;font-size:.82rem;cursor:pointer;font-family:inherit}
.btn:hover{background:rgba(255,255,255,.1);color:#fff}
.note{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-left:3px solid #7b61ff;border-radius:12px;padding:14px 16px;margin-bottom:12px;cursor:pointer;transition:background .15s}
.note:hover{background:rgba(255,255,255,.07)}
.note .text{font-size:1rem;color:#e4e6eb}
.note .meta{margin-top:9px;font-size:.76rem;color:#7b8299;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note .src{color:#7b61ff}
.note .del{margin-left:auto;color:#6b7390;border:none;background:none;cursor:pointer;font-size:.9rem;padding:2px 6px;border-radius:6px}
.note .del:hover{color:#ff6b6b;background:rgba(255,107,107,.1)}
.pending{border-left-color:#ffa726}
.pending .src::after{content:" · 待同步"}
.empty{text-align:center;color:#7b8299;padding:60px 20px;font-size:.95rem;line-height:2}
.back{position:fixed;top:16px;left:16px;padding:7px 13px;border-radius:14px;background:rgba(30,30,50,.8);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);color:#a0a8c0;text-decoration:none;font-size:.8rem;z-index:100}
.back:hover{color:#fff}
</style>
</head>
<body>
<a class="back" href="/index.zh.html">← Hub</a>
<div class="container">
<header>
  <h1>我的笔记</h1>
  <div class="sub" id="count">载入中…</div>
</header>
<div class="bar">
  <input type="search" id="q" placeholder="搜索笔记内容或文章标题…">
  <button class="btn" id="refresh">↻ 同步</button>
  <span class="btn" id="who" style="display:none;cursor:default;border-style:dashed"></span>
  <button class="btn" id="logout" style="display:none">退出</button>
</div>
<div id="list"></div>
</div>

<script defer src="/notes.js"></script>
<script>
(function () {
  var listEl = document.getElementById('list');
  var countEl = document.getElementById('count');
  var qEl = document.getElementById('q');
  var all = [];

  function fmtDate(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
  }

  function render() {
    var q = qEl.value.trim().toLowerCase();
    var rows = all.filter(function (n) {
      return !q || (n.text + ' ' + (n.title || '')).toLowerCase().indexOf(q) >= 0;
    });
    countEl.textContent = all.length
      ? (rows.length === all.length ? all.length + ' 条笔记' : rows.length + ' / ' + all.length + ' 条')
      : '';
    if (!rows.length) {
      listEl.innerHTML = '<div class="empty">' +
        (all.length ? '没有匹配的笔记。'
                    : '还没有笔记。<br>在任意文章里选中一段文字，点「＋ 笔记」即可保存。') +
        '</div>';
      return;
    }
    listEl.innerHTML = '';
    rows.forEach(function (n) {
      var card = document.createElement('div');
      card.className = 'note' + (n._pending ? ' pending' : '');

      var t = document.createElement('div');
      t.className = 'text';
      t.textContent = n.text;
      card.appendChild(t);

      var meta = document.createElement('div');
      meta.className = 'meta';
      var src = document.createElement('span');
      src.className = 'src';
      src.textContent = n.title || n.page;
      meta.appendChild(src);
      var when = document.createElement('span');
      when.textContent = fmtDate(n.ts);
      meta.appendChild(when);
      var del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.title = '删除';
      del.addEventListener('click', function (e) {
        e.stopPropagation();
        if (!confirm('删除这条笔记？')) return;
        window.BigCatNotes.remove(n.id);
        all = all.filter(function (x) { return x.id !== n.id; });
        render();
      });
      meta.appendChild(del);
      card.appendChild(meta);

      // Tap a note -> open the article at #note=<id>; notes.js re-locates the
      // passage there, scrolls to it and flashes the highlight.
      card.addEventListener('click', function () {
        location.href = n.page + '#note=' + n.id;
      });
      listEl.appendChild(card);
    });
  }

  function load() {
    countEl.textContent = '载入中…';
    var pendingIds = {};
    try {
      (JSON.parse(localStorage.getItem('bigcat-notes-queue')) || []).forEach(function (n) {
        pendingIds[n.id] = 1;
      });
    } catch (e) {}
    window.BigCatNotes.list().then(function (notes) {
      all = notes.map(function (n) { n._pending = !!pendingIds[n.id]; return n; });
      render();
    }).catch(function () {
      countEl.textContent = '载入失败';
    });
  }

  function start() {
    if (!window.BigCatNotes) { setTimeout(start, 100); return; }
    if (!window.BigCatNotes.isLoggedIn()) { showLoggedOut(); return; }
    window.BigCatNotes.me().then(function (email) {
      if (!email) { showLoggedOut(); return; }
      var who = document.getElementById('who');
      who.textContent = email;
      who.style.display = '';
      document.getElementById('logout').style.display = '';
      load();
    });
  }

  function showLoggedOut() {
    countEl.textContent = '';
    listEl.innerHTML = '<div class="empty">笔记是私有的，登录后才能查看。<br>' +
      '<a class="btn" style="display:inline-block;margin-top:12px;text-decoration:none" ' +
      'href="/account.html?next=%2Fnotes.html">登录 / 注册</a></div>';
  }

  qEl.addEventListener('input', render);
  document.getElementById('refresh').addEventListener('click', function () {
    window.BigCatNotes.flush().then(load);
  });
  document.getElementById('logout').addEventListener('click', function () {
    window.BigCatNotes.logout().then(function () { location.href = '/account.html'; });
  });
  start();
})();
</script>
</body>
</html>
