<!DOCTYPE html>
<html lang="zh-CN" data-pagefind-ignore data-no-hub-nav>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的笔记 · My Notes</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1a1a2e">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"SF Pro Display","Noto Serif SC","Songti SC",sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0a0e1a 100%);color:#e4e6eb;line-height:1.7;min-height:100vh}
.container{max-width:820px;margin:0 auto;padding:40px 20px 80px}
header{text-align:center;padding:28px 0 18px}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#00d4ff 0%,#7b61ff 50%,#ff6ec4 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:1px}
.sub{color:#a0a8c0;font-size:.9rem;margin-top:6px}
.bar{display:flex;gap:8px;align-items:center;margin:20px 0 14px;flex-wrap:wrap}
input[type=search]{flex:1;min-width:180px;padding:9px 13px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#e4e6eb;font-size:.9rem;font-family:inherit}
input[type=search]::placeholder{color:#6b7390}
.btn{padding:8px 13px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#a0a8c0;font-size:.82rem;cursor:pointer;font-family:inherit}
.btn:hover{background:rgba(255,255,255,.1);color:#fff}
.group-label{margin:20px 0 8px;font-size:.8rem;font-weight:700;color:#7b61ff;letter-spacing:.5px;font-family:"SF Mono",Menlo,monospace;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:6px 4px;border-radius:8px}
.group-label:hover{background:rgba(123,97,255,.08)}
.group-label .n{color:#6b7390;font-weight:400;font-size:.72rem}
.group-label .caret{display:inline-block;width:10px;color:#6b7390;font-size:.7rem;transition:transform .15s}
.group.open > .group-label .caret{transform:rotate(90deg)}
.group:first-of-type .group-label{margin-top:6px}
.group > .group-body{display:none;padding-left:6px}
.group.open > .group-body{display:block}
.art{margin:6px 0 6px 8px;border-left:2px solid rgba(255,255,255,.08);padding-left:10px}
.art-label{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:6px 4px;border-radius:8px;font-size:.86rem;color:#c9cede}
.art-label:hover{background:rgba(255,255,255,.05)}
.art-label .n{color:#6b7390;font-size:.72rem;font-family:"SF Mono",Menlo,monospace}
.art-label .caret{display:inline-block;width:10px;color:#6b7390;font-size:.7rem;transition:transform .15s}
.art.open > .art-label .caret{transform:rotate(90deg)}
.art > .art-body{display:none;padding-top:4px}
.art.open > .art-body{display:block}
.note{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-left:3px solid #7b61ff;border-radius:12px;padding:14px 16px;margin-bottom:12px;cursor:pointer;transition:background .15s}
.note:hover{background:rgba(255,255,255,.07)}
.note .text{font-size:1rem;color:#e4e6eb}
.note .comment{margin-top:10px;padding:9px 12px;background:rgba(123,97,255,.09);border-radius:8px;font-size:.9rem;color:#cdd2e4;white-space:pre-wrap;cursor:text}
.note .add-comment{margin-top:9px;background:none;border:1px dashed rgba(255,255,255,.18);color:#7b8299;font-size:.78rem;padding:5px 10px;border-radius:8px;cursor:pointer;font-family:inherit}
.note .add-comment:hover{color:#a89bff;border-color:rgba(123,97,255,.5)}
.note .comment-input{width:100%;margin-top:10px;padding:9px 12px;border-radius:8px;border:1px solid rgba(123,97,255,.4);background:rgba(0,0,0,.2);color:#e4e6eb;font:inherit;font-size:.9rem;line-height:1.6;resize:vertical;min-height:60px}
.note .comment-bar{margin-top:8px;display:flex;gap:8px}
.note .comment-bar .btn{font-size:.78rem;padding:5px 12px}
.note .comment-bar .save{background:#7b61ff;color:#fff;border-color:#7b61ff}
.note .meta{margin-top:9px;font-size:.76rem;color:#7b8299;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note .src{color:#7b61ff}
.note .del{margin-left:auto;color:#6b7390;border:none;background:none;cursor:pointer;font-size:.9rem;padding:2px 6px;border-radius:6px}
.note .del:hover{color:#ff6b6b;background:rgba(255,107,107,.1)}
.pending{border-left-color:#ffa726}
.pending .src::after{content:" · 待同步"}
.empty{text-align:center;color:#7b8299;padding:60px 20px;font-size:.95rem;line-height:2}
.back{position:fixed;top:16px;left:16px;padding:7px 13px;border-radius:14px;background:rgba(30,30,50,.8);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);color:#a0a8c0;text-decoration:none;font-size:.8rem;z-index:100}
.back:hover{color:#fff}
.lang{position:fixed;top:16px;right:16px;padding:7px 11px;border-radius:14px;background:rgba(30,30,50,.8);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);color:#a0a8c0;text-decoration:none;font-size:.8rem;z-index:100}
.lang:hover{color:#fff}
</style>
</head>
<body>
<a class="back" href="/index.zh.html">← Hub</a>
<a class="lang" href="/notes.en.html">EN</a>
<div class="container">
<header>
  <h1>我的笔记</h1>
  <div class="sub" id="count">载入中…</div>
</header>
<div class="bar">
  <input type="search" id="q" placeholder="搜索笔记内容或文章标题…">
  <button class="btn" id="refresh">↻ 同步</button>
  <span class="btn" id="who" style="display:none;cursor:default;border-style:dashed"></span>
  <button class="btn" id="logout" style="display:none">退出</button>
</div>
<div id="list"></div>
</div>

<script defer src="/notes.js"></script>
<script defer src="/reads.js"></script>
<script>
(function () {
  var listEl = document.getElementById('list');
  var countEl = document.getElementById('count');
  var qEl = document.getElementById('q');
  var all = [];

  function fmtDate(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
  }

  // Articles list in the same order as the repo's index page, which runs in
  // ascending day/week/book/topic number. Unnumbered pages (e.g. deep-research
  // plain/deep pairs) sort last, by title.
  function artOrder(page) {
    var m = /-(?:day|week|book|topic)0*(\d+)(?:\.[a-z]{2})?\.html$/i.exec(page || '');
    return m ? parseInt(m[1], 10) : Number.MAX_SAFE_INTEGER;
  }

  // Group notes by repo (仓), newest group first, newest note first within.
  function groupByRepo(rows) {
    var map = {};
    rows.forEach(function (n) {
      var slug = window.BigCatNotes.repoSlug(n.page) || '_other';
      if (!map[slug]) {
        map[slug] = {
          label: window.BigCatNotes.repoLabel(n.page, 'zh'),
          items: [], newest: n.ts, arts: {},
        };
      }
      var g = map[slug];
      g.items.push(n);
      if (n.ts > g.newest) g.newest = n.ts;
      // Second level: one bucket per article within the repo.
      if (!g.arts[n.page]) {
        g.arts[n.page] = { page: n.page, label: n.title || n.page, items: [], newest: n.ts };
      }
      var a = g.arts[n.page];
      a.items.push(n);
      if (n.ts > a.newest) a.newest = n.ts;
    });
    return Object.keys(map).map(function (k) {
      var g = map[k];
      g.articles = Object.keys(g.arts).map(function (p) { return g.arts[p]; })
        .sort(function (a, b) { return artOrder(a.page) - artOrder(b.page) || a.label.localeCompare(b.label); });
      return g;
    }).sort(function (a, b) { return b.newest - a.newest; });
  }

  function buildCard(n) {
    var card = document.createElement('div');
    card.className = 'note' + (n._pending ? ' pending' : '');

    var t = document.createElement('div');
    t.className = 'text';
    t.textContent = n.text;
    card.appendChild(t);

    // Free-text comment (your own words), editable inline.
    var cWrap = document.createElement('div');
    function showComment() {
      cWrap.innerHTML = '';
      if (n.comment) {
        var c = document.createElement('div');
        c.className = 'comment';
        c.textContent = n.comment;
        c.title = '点击编辑';
        c.addEventListener('click', function (e) { e.stopPropagation(); editComment(); });
        cWrap.appendChild(c);
      } else {
        var add = document.createElement('button');
        add.className = 'add-comment';
        add.textContent = '＋ 写点想法';
        add.addEventListener('click', function (e) { e.stopPropagation(); editComment(); });
        cWrap.appendChild(add);
      }
    }
    function editComment() {
      cWrap.innerHTML = '';
      var ta = document.createElement('textarea');
      ta.className = 'comment-input';
      ta.value = n.comment || '';
      ta.placeholder = '写下你的想法、联想或问题…';
      ta.addEventListener('click', function (e) { e.stopPropagation(); });
      var bar = document.createElement('div');
      bar.className = 'comment-bar';
      var save = document.createElement('button');
      save.className = 'btn save';
      save.textContent = '保存';
      var cancel = document.createElement('button');
      cancel.className = 'btn';
      cancel.textContent = '取消';
      save.addEventListener('click', function (e) {
        e.stopPropagation();
        n.comment = ta.value.trim();
        window.BigCatNotes.setComment(n.id, n.comment);
        showComment();
      });
      cancel.addEventListener('click', function (e) { e.stopPropagation(); showComment(); });
      bar.appendChild(save);
      bar.appendChild(cancel);
      cWrap.appendChild(ta);
      cWrap.appendChild(bar);
      ta.focus();
    }
    showComment();
    card.appendChild(cWrap);

    var meta = document.createElement('div');
    meta.className = 'meta';
    var when = document.createElement('span');
    when.textContent = fmtDate(n.ts);
    meta.appendChild(when);
    var del = document.createElement('button');
    del.className = 'del';
    del.textContent = '✕';
    del.title = '删除';
    del.addEventListener('click', function (e) {
      e.stopPropagation();
      if (!confirm('删除这条笔记？')) return;
      window.BigCatNotes.remove(n.id);
      all = all.filter(function (x) { return x.id !== n.id; });
      render();
    });
    meta.appendChild(del);
    card.appendChild(meta);

    // Tap a note -> open the article at #note=<id>; notes.js re-locates the
    // passage there, scrolls to it and flashes the highlight.
    card.addEventListener('click', function () {
      location.href = n.page + '#note=' + n.id;
    });
    return card;
  }

  function render() {
    var q = qEl.value.trim().toLowerCase();
    var rows = all.filter(function (n) {
      return !q || (n.text + ' ' + (n.comment || '') + ' ' + (n.title || '')).toLowerCase().indexOf(q) >= 0;
    });
    countEl.textContent = all.length
      ? (rows.length === all.length ? all.length + ' 条笔记' : rows.length + ' / ' + all.length + ' 条')
      : '';
    if (!rows.length) {
      listEl.innerHTML = '<div class="empty">' +
        (all.length ? '没有匹配的笔记。'
                    : '还没有笔记。<br>在任意文章里选中一段文字，点「＋ 笔记」即可保存。') +
        '</div>';
      return;
    }
    listEl.innerHTML = '';
    // Two collapsible levels: 仓 → 文章 → 笔记. Both start collapsed so the
    // page opens as a short overview; searching auto-opens whatever matched.
    var expand = !!q;
    groupByRepo(rows).forEach(function (g) {
      var group = document.createElement('div');
      group.className = 'group' + (expand ? ' open' : '');

      var label = document.createElement('div');
      label.className = 'group-label';
      var caret = document.createElement('span');
      caret.className = 'caret';
      caret.textContent = '▸';
      label.appendChild(caret);
      var name = document.createElement('span');
      name.textContent = g.label;
      label.appendChild(name);
      var count = document.createElement('span');
      count.className = 'n';
      count.textContent = g.items.length;
      label.appendChild(count);
      label.addEventListener('click', function () { group.classList.toggle('open'); });
      group.appendChild(label);

      var body = document.createElement('div');
      body.className = 'group-body';
      g.articles.forEach(function (a) {
        var art = document.createElement('div');
        art.className = 'art' + (expand ? ' open' : '');

        var aLabel = document.createElement('div');
        aLabel.className = 'art-label';
        var aCaret = document.createElement('span');
        aCaret.className = 'caret';
        aCaret.textContent = '▸';
        aLabel.appendChild(aCaret);
        var aName = document.createElement('span');
        aName.textContent = a.label;
        aLabel.appendChild(aName);
        var aCount = document.createElement('span');
        aCount.className = 'n';
        aCount.textContent = a.items.length;
        aLabel.appendChild(aCount);
        aLabel.addEventListener('click', function () { art.classList.toggle('open'); });
        art.appendChild(aLabel);

        var aBody = document.createElement('div');
        aBody.className = 'art-body';
        // Article-level thought (shared with the article page's own box).
        if (window.BigCatReads) {
          var th = window.BigCatReads.thoughtEditor(a.page, function () {});
          th.style.margin = '2px 0 10px';
          aBody.appendChild(th);
        }
        a.items.forEach(function (n) { aBody.appendChild(buildCard(n)); });
        art.appendChild(aBody);
        body.appendChild(art);
      });
      group.appendChild(body);
      listEl.appendChild(group);
    });
  }

  function load() {
    countEl.textContent = '载入中…';
    var pendingIds = {};
    try {
      (JSON.parse(localStorage.getItem('bigcat-notes-queue')) || []).forEach(function (n) {
        pendingIds[n.id] = 1;
      });
    } catch (e) {}
    window.BigCatNotes.list().then(function (notes) {
      all = notes.map(function (n) { n._pending = !!pendingIds[n.id]; return n; });
      render();
    }).catch(function () {
      countEl.textContent = '载入失败';
    });
  }

  function start() {
    if (!window.BigCatNotes || !window.BigCatReads) { setTimeout(start, 100); return; }
    if (!window.BigCatNotes.isLoggedIn()) { showLoggedOut(); return; }
    window.BigCatReads.sync().then(function () { if (all.length) render(); });
    window.BigCatNotes.me().then(function (email) {
      if (!email) { showLoggedOut(); return; }
      var who = document.getElementById('who');
      who.textContent = email;
      who.style.display = '';
      document.getElementById('logout').style.display = '';
      load();
    });
  }

  function showLoggedOut() {
    countEl.textContent = '';
    listEl.innerHTML = '<div class="empty">笔记是私有的，登录后才能查看。<br>' +
      '<a class="btn" style="display:inline-block;margin-top:12px;text-decoration:none" ' +
      'href="/account.html?next=%2Fnotes.html">登录 / 注册</a></div>';
  }

  qEl.addEventListener('input', render);
  document.getElementById('refresh').addEventListener('click', function () {
    window.BigCatNotes.flush().then(load);
  });
  document.getElementById('logout').addEventListener('click', function () {
    window.BigCatNotes.logout().then(function () { location.href = '/account.html'; });
  });
  start();
})();
</script>
</body>
</html>
